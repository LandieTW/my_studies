header: |
  Project: Marlin
  Analysis: Basket Tchibum Test
  Author: Lucas Ferreira    Date: 10-Jul-2026

  Place text in this area showing calculations etc. that are relevant to the
  analysis. This text will be included in the report generated by the script.

  - Min DAF for Crane Wire = 0.1;
  - Slack allowed for structure slings (tension > 0, acc. to DNV-ST-N001);
  - Probability level of non-exceedance = 0.9, except for vessel assets;
  - Probability level of non-exceedance for crane wire loads and vessel hull contact = 0.9;



# Simulation parameters
base_file: "base.dat"                   # No Default (Required Key)
hs_start: 2.5                           # Default = 3.5             Maximum value for hs. Simulations start with this value.
hs_course_step: 0.5                     # Default = 0.5             Initial Hs reduction step.  Starting at hs_start, Hs will reduce by this amount until all are acceptable.
hs_fine_step: 0.5                       # Default = hs_course_step  Final Hs reduction step.  Once the acceptable Hs has be found using hs_course_step value, Hs will be decreased from the last failed hs by hs_fine_step to see if a slightly higher Hs can be obtained.
hs_min: 1.5                             # Default = 0.25            The lowest Hs to consider.
period_type: "Tp"                       # Default = "Tp"            Options: Tp (Spectral Peak Period), Tz ()
calculate_jonswap_gamma: True           # Default = True            Options: True (calculate gamma per Isherwood - same as Orcaflex), False (manually input Gamma)
calculate_jonswap_gamma_method: "pb"    # Default = "of"            Options: "of" (OrcaFlex method), "dnv" (DNV Method) or "pb" (Petrobras Method), If calculate_jonswap_gamma is False, this value is ignored
calculate_min_period: False             # Default = True            Options: True (calculate minimum period based on Hs/DNv-RP-N103), False (use t_start value)
jonswap_gamma: 1                        # Default = 1               Jonswap gamma value to use if calculate_jonswap_gamma is False. If True, this value is ignored.
t_end: 12                                # Default = 18              Largest period to consider
t_start: 4                              # Default = 1.0             Minimum period to consider. If calculate_min_period is True, this value is ignored.
t_step: 1                               # Default = 1.0             Time step for periods < t_step_change
t_step2: 1                              # Default = 2.0             Time step for periods > t_step_change  
t_step_change: 8.0                      # Default = 8.0             Period at which to change the time step from t_step to t_step2
t_extra: []                             # Default = []              List of additional periods to consider. These will be added to the periods generated by the t_start, t_end, t_step, and t_step2 values.
wave_dirs: [165, 180, 195]              # Default = [165, 180, 195] List of wave directions to consider.
min_seeds: 100                          # Default = 50              Minimum number of seeds to run for each Hs/Period combination.
seed_random_generator: 12343            # Default = 12343           Random seed to use for the random number generator. This is used to ensure that the same seeds are used for each run.
alpha_factor: 1.0                       # Default = 1.0             Alpha factor to consider lower hs when calculating start_t. This is used to adjust the starting period based on the Hs value.
run_method: "hpcflex"                   # Default = "dof"           Options: "dof" (default), "local", or "hpcflex". Determines how the simulation is run.
extra_files: []                         # Default = []              List of extra files to be copied to the runs folder. This is used to copy any additional files needed for the simulation.
ks_test_criteria: 0.05                  # Default = 0.05            Kolmogorov-Smirnov test criteria for the statistical analysis. If the p-value is less than this value, the data is considered to not fit the distribution.
ad_test_criteria: 0.05                  # Default = 0.05            Anderson-Darling test criteria for the statistical analysis. If the p-value is less than this value, the data is considered to not fit the distribution.
force_skip_sim_file_save: True          # Default = True            Options: True (do not save simulation files), False (save simulation files). If True, the model will not save simulation files.
automatic_post_calc: True               # Default = True            Options: True (automatically create PostCalcAction), False (do not create PostCalcAction, requires a post calcuation file specfied in Orcaflex File).
num_bootstraps: 10000                   # Default = 10000           Number of boostrap samples to perform
max_bisections: 4                       # Default = 0               Integer representing how many times the time step is halved if a simulation is unstable.
conf_interval: 0.90                     # Default = 0.95            Confidence level for bootstrapping
email_on_failure: True                  # Default = False           Send an email on the failure of the script
email_on_loop: True                     # Default = False           Send an email on for each loop of the analysis
email_on_finish: True                   # Default = False           Send an email when the script finishes
zero_wave_timeout: 600                  # Default = 600             Time in seconds to wait for a zero wave simulation to complete before considering it a failure and moving on to the next simulation. This is used to prevent the script from getting stuck on a simulation that is not producing waves. 

